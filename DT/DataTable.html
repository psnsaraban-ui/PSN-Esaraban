let users = [];
let selectedUsers = [];

const loadUsers = () => {
  google.script.run.withSuccessHandler(function(retrievedUsers) {
    users = retrievedUsers;
    renderUserTable(users);
  }).selectUsersToken();
};

const renderUserTable = (usersToRender) => {
    const table = document.getElementById('userTable');
    table.innerHTML = ''; 
    usersToRender.forEach((userTK, index) => {
        const row = table.insertRow();
        row.insertCell(0).innerHTML = index + 1;
        row.insertCell(1).innerHTML = userTK.sendFullname;
        row.insertCell(2).innerHTML = userTK.sendDepartment;
        const selectCell = row.insertCell(3);
        const switchDiv = document.createElement('div');
        switchDiv.className = 'form-check form-switch';
        const switchInput = document.createElement('input');
        switchInput.className = 'form-check-input';
        switchInput.type = 'checkbox';
        switchInput.role = 'switch';
        switchInput.id = 'flexSwitchCheckDefault_' + users.indexOf(userTK);
        switchInput.addEventListener('change', function() {
            const icon = this.nextElementSibling.querySelector('i');
            if (this.checked) {
                icon.className = 'fa-solid fa-square-check text-success';
                selectedUsers.push(userTK);
            } else {
                icon.className = 'fa-solid fa-square text-light';
                selectedUsers = selectedUsers.filter(u => u !== userTK);
            }
            updateSelectedUsers();
        });
        const switchLabel = document.createElement('label');
        switchLabel.className = 'form-check-label';
        switchLabel.htmlFor = 'flexSwitchCheckDefault_' + users.indexOf(userTK);
        const icon = document.createElement('i');
        icon.className = 'fa-solid fa-square text-light';
        switchLabel.appendChild(icon);
        switchDiv.appendChild(switchInput);
        switchDiv.appendChild(switchLabel);
        selectCell.appendChild(switchDiv);

        const checkbox = document.getElementById('flexSwitchCheckDefault_' + users.indexOf(userTK));
        if (checkbox) {
            checkbox.checked = selectedUsers.includes(userTK);
            const icon = checkbox.nextElementSibling.querySelector('i');
            if (icon) {
                icon.className = checkbox.checked ? 'fa-solid fa-square-check text-success' : 'fa-solid fa-square text-light';
            }
        }
    });
};

const filterUsersByDepartment = () => {
const department = document.getElementById('searchDataSend').value;
  if (department) {
const filteredUsers = users.filter(userTK => userTK.sendDepartment === department);
      renderUserTable(filteredUsers);
  } else {
    renderUserTable(users);
  }
  updateCheckboxes();
};

const updateSelectedUsers = () => {
const selectedTable = document.getElementById('selectedUserTable');
  selectedTable.innerHTML = '';
  selectedUsers.forEach((userTK, index) => {
  const row = selectedTable.insertRow();
        row.insertCell(0).innerHTML = index + 1;
        row.insertCell(1).innerHTML = userTK.sendFullname;
        row.insertCell(2).innerHTML = userTK.sendDepartment;
  const deleteCell = row.insertCell(3);
  const deleteButton = document.createElement('button');
        deleteButton.className = 'btn del-button btn-sm';
        deleteButton.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
        deleteButton.addEventListener('click', function() {
        selectedUsers = selectedUsers.filter(u => u !== userTK);
        updateSelectedUsers();
  const checkbox = document.getElementById('flexSwitchCheckDefault_' + users.indexOf(userTK));
        if (checkbox) {
            checkbox.checked = false;
  const icon = checkbox.nextElementSibling.querySelector('i');
            if (icon) {
              icon.className = 'fa-solid fa-square text-light';
            }
          }
        });
       deleteCell.appendChild(deleteButton);
    });
  updateCheckboxes();
};

const updateCheckboxes = () => {
  users.forEach((userTK, index) => {
  const checkbox = document.getElementById('flexSwitchCheckDefault_' + index);
  if (checkbox) {
      checkbox.checked = selectedUsers.includes(userTK);
  const icon = checkbox.nextElementSibling.querySelector('i');
      if (icon) {
        icon.className = checkbox.checked ? 'fa-solid fa-square-check text-success' : 'fa-solid fa-square text-light';
      }
    }
  });
};

const resetCheckboxes = () => {
  selectedUsers = [];
  users.forEach((userTK, index) => {
  const checkbox = document.getElementById('flexSwitchCheckDefault_' + index);
    if (checkbox) {
        checkbox.checked = false;
  const icon = checkbox.nextElementSibling.querySelector('i');
    if (icon) {icon.className = 'fa-solid fa-square text-light';}
    }
  });
  updateSelectedUsers();
};

const addTodoSet = () => {
const todoInput = document.getElementById('todoInput');

  if (todoText) {
    todoList.push(todoText);
    renderTodoList();
    todoInput.value = '';
  }
}

const removeTodo = (index) => {
  todoList.splice(index, 1);
  renderTodoList();
}

const editTodo = (index) => {
const todoTextElement = document.getElementById(`todo-text-${index}`);
      todoTextElement.removeAttribute('readonly');
      todoTextElement.focus();
}

const updateTodo = (index) => {
const todoTextElement = document.getElementById(`todo-text-${index}`);
      todoList[index] = todoTextElement.value.trim();
      todoTextElement.setAttribute('readonly', 'readonly');
      renderTodoList();
}

const renderTodoList = () => {
const todoListElement = document.getElementById('todoList');
      todoListElement.innerHTML = `
        <li class="list-group-item header-item" style="color: var(--bs-white); font-size: 18px;">
          <div class="d-flex justify-content-between">
            <span>🛠️ รายการ</span>
            <span>จัดการ</span>
          </div>
        </li>`;
      todoList.forEach((todo, index) => {
const todoItem = document.createElement('li');
      todoItem.className = 'list-group-item todo-item';
      todoItem.innerHTML = `
          <input type="text" id="todo-text-${index}" value="${todo}" class="form-control me-2" readonly
                 onblur="updateTodo(${index})" onkeypress="if(event.key === 'Enter') updateTodo(${index})">
          <button class="btn edit-button btn-sm me-2" onclick="editTodo(${index})"><i class="fa fa-edit"></i></button>
          <button class="btn del-button btn-sm" onclick="removeTodo(${index})"><i class="fa fa-trash"></i></button>`;
    todoListElement.appendChild(todoItem);
  });
}

let agencyShow = [];
let selectedAgency = [];

const loadAgencyLoad = () => {
  google.script.run.withSuccessHandler(function(retrievedAgency) {
    agencyShow = retrievedAgency;
    agencyRenderTable(agencyShow);
  }).selectUsersAgency();
};

const agencyRenderTable = (ageToRender) => {
  const table = document.getElementById('agencyTable');
  table.innerHTML = '';
  ageToRender.forEach((rowAge, index) => {
    const row = table.insertRow();
    const checkboxCell = row.insertCell(0);
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = selectedAgency.includes(rowAge);
    checkbox.addEventListener('change', function() {
      if (checkbox.checked) {
        if (!selectedAgency.includes(rowAge)) {
          selectedAgency.push(rowAge);
          agencyUpdateSelected();
        }
      } else {
        selectedAgency = selectedAgency.filter(u => u !== rowAge);
        agencyUpdateSelected();
      }
    });
    checkboxCell.appendChild(checkbox);
    row.insertCell(1).innerHTML = index + 1;
    row.insertCell(2).innerHTML = rowAge.agencyName;
    const selectCell = row.insertCell(3);
    const button = document.createElement('button');
    button.className = 'btn btn-sm edit-button';
    button.innerHTML = 'ส่งข้อมูล';
    button.addEventListener('click', function() {
      if (!selectedAgency.includes(rowAge)) {
        selectedAgency.push(rowAge);
        agencyUpdateSelected();
      }
    });
    selectCell.appendChild(button);
  });
};

const agencyUpdateSelected = () => {
  const selectedTable = document.getElementById('selectedAgencyTable');
  selectedTable.innerHTML = '';
  selectedAgency.forEach((rowAge, index) => {
    const row = selectedTable.insertRow();
    row.insertCell(0).innerHTML = index + 1;
    row.insertCell(1).innerHTML = rowAge.agencyName;
    row.insertCell(2).innerHTML = '<input type="text" class="form-control" placeholder="กรอกไปรษณีย์อิเล็กทรอนิกส์" required>';
    const aliasCell = row.insertCell(3);
    const select = document.createElement('select');
    select.className = 'form-select';
    ['@gmail.com', '@hotmail.com', '@outlook.com', '@yahoo.com'].forEach(alias => {
      const option = document.createElement('option');
      option.value = alias;
      option.text = alias;
      select.appendChild(option);
    });
    aliasCell.appendChild(select);
    const deleteCell = row.insertCell(4);
    const deleteButton = document.createElement('button');
    deleteButton.className = 'btn btn-sm del-button';
    deleteButton.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
    deleteButton.addEventListener('click', function() {
      selectedAgency = selectedAgency.filter(u => u !== rowAge);
      agencyUpdateSelected();
      agencyRenderTable(agencyShow);
    });
    deleteCell.appendChild(deleteButton);
  });
  agencyRenderTable(agencyShow);
};

const agencyResetCheckboxes = () => {
  selectedAgency = [];
  agencyUpdateSelected();
};

const filterAgency = () => {
  const searchTerm = document.getElementById('searchAgency').value.toLowerCase();
  const filteredAgency = agencyShow.filter(rowAge => rowAge.agencyName.toLowerCase().includes(searchTerm));
  agencyRenderTable(filteredAgency);
};
