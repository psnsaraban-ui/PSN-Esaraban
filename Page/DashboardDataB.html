<div class="row g-3">

<script>
const claerModalDataB = () => {
  $('#updatadataB1').hide();
  $('#updatadataB2').hide();
  $('#dataDataBInputKey').val("")
  $('#dataDataBInput1').val("")
  $('#dataDataBInput2').val("")
  $('#dataDataBInput3').val("")
  $('#dataDataBInput4').val("")
  $('#dataDataBInput5').val("")
  $('#dataDataBInput6').val("")
  $('#dataDataBInput7').val("")
  $("#fileDataB9").val("")
  $("#fileDataB10").val("")
  resetUploadSwitches();
  const inputdateB4 = document.getElementById('dataDataBInput4') 
  inputdateB4.type = "date";
  const inputdateB6 = document.getElementById('dataDataBInput6') 
  inputdateB6.type = "date";
}

const submitAddDataB = async (obj, event) => {
  event.preventDefault();
  const dataDataBInputKey = $('#dataDataBInputKey').val();
  const dataDataBInput2 = $('#dataDataBInput2').val();
  const dataDataBInput3 = $('#dataDataBInput3').val();
  const dataDataBInput5 = $('#dataDataBInput5').val();
  const dataDataBInput6 = $('#dataDataBInput6').val();
  const dataDataBInput7 = $('#dataDataBInput7').val();
  const dataDataBInput8 = $('#dataDataBInput8').val();
  const fileDataB9 = $('#fileDataB9').prop('files')[0];
  const fileDataB10 = $('#fileDataB10').prop('files')[0];

  if (dataDataBInputKey === "" && (!dataDataBInput2 || !dataDataBInput3 || !dataDataBInput5 || !dataDataBInput6 || !dataDataBInput7 || !dataDataBInput8 || !fileDataB9)) {
    createToast("⚠️ กรุณากรอกข้อมูลให้ครบถ้วน", 3);
    $.LoadingOverlay("hide");
    return;
  } else if (dataDataBInputKey !== "" && (!dataDataBInput2 || !dataDataBInput3 || !dataDataBInput5 || !dataDataBInput6 || !dataDataBInput7 || !dataDataBInput8)) {
    createToast("⚠️ กรุณากรอกข้อมูลให้ครบถ้วน", 3);
    $.LoadingOverlay("hide");
    return;
  }

  $.LoadingOverlay("show", { image: "", fontawesome: "fa fa-spinner fa-spin" });
  obj.myfileDataB9 = fileDataB9 ? await getBase64(fileDataB9) : "";
  obj.myfileDataB10 = fileDataB10 ? await getBase64(fileDataB10) : "";

  if (dataDataBInputKey === "") {
    google.script.run.withSuccessHandler(function(res) {
      $('#DataBSetModal').modal('hide');
      $('#dataDataBInput1').val("")
      $('#dataDataBInput2').val("")
      $('#dataDataBInput3').val("")
      $('#dataDataBInput4').val("")
      $('#dataDataBInput5').val("")
      $('#dataDataBInput6').val("")
      $('#dataDataBInput7').val("")
      $("#fileDataB9").val("")
      $("#fileDataB10").val("")
      $.LoadingOverlay("hide");
      createToast("✅ บันทึกข้อมูลสำเร็จ", 1);
      resetUploadSwitches();
      insertDataB();
    }).addDataB(obj);
  } else {
    google.script.run.withSuccessHandler(function(res) {
      $('#DataBSetModal').modal('hide');
      $('#dataDataBInput1').val("")
      $('#dataDataBInput2').val("")
      $('#dataDataBInput3').val("")
      $('#dataDataBInput4').val("")
      $('#dataDataBInput5').val("")
      $('#dataDataBInput6').val("")
      $('#dataDataBInput7').val("")
      $("#fileDataB9").val("")
      $("#fileDataB10").val("")
      $.LoadingOverlay("hide");
      createToast("✅ แก้ไขข้อมูลสำเร็จ", 1);
      resetUploadSwitches();
      insertDataB();
    }).upDateDataB(obj);
  }
};

const editDataB = (el) => {
  const row = el.parentNode.parentNode.cells;
  const idDataB = row[0].textContent.trim();
  const dataDataBInput1 = row[1].textContent.trim();
  const dataDataBInput2 = row[2].textContent.trim();
  const dataDataBInput3 = row[3].textContent.trim();
  const dataDataBInput4 = row[4].textContent.trim();
  const dataDataBInput5 = row[5].textContent.trim();
  const dataDataBInput6 = row[6].textContent.trim();
  const dataDataBInput7 = row[7].textContent.trim();
  const dataDataBInput8 = row[8].textContent.trim();
  const inputdateB4 = document.getElementById('dataDataBInput4') 
  inputdateB4.type = "text";
  const inputdateB6 = document.getElementById('dataDataBInput6') 
  inputdateB6.type = "text";
  $('#DataBSetModal').modal('show');
  $('#updatadataB1').show();
  $('#updatadataB2').show();
  $('#dataDataBInputKey').val(idDataB);
  $('#dataDataBInput1').val(dataDataBInput1);
  $('#dataDataBInput2').val(dataDataBInput2);
  $('#dataDataBInput3').val(dataDataBInput3);
  $('#dataDataBInput4').val(dataDataBInput4);
  $('#dataDataBInput5').val(dataDataBInput5);
  $('#dataDataBInput6').val(dataDataBInput6);
  $('#dataDataBInput7').val(dataDataBInput7);
  $('#dataDataBInput8').val(dataDataBInput8);
}

const delDataB = (el) => {
  const record = el.parentNode.parentNode.cells[0].innerText;
  $('#confirmBtnDel').off('click').on('click', function() {
    $.LoadingOverlay("show", { image: "", fontawesome: "fa fa-spinner fa-spin" });
    $('#DelDataModal').modal('hide');
    google.script.run.withSuccessHandler(function() {
      $.LoadingOverlay("hide");
      insertDataB();
      createToast("⛔ ลบข้อมูลสำเร็จ", 0);
    }).delRecDataB(record);
  });
  $('#xDelconfirmData').off('click').on('click', function() {
    $('#DelDataModal').modal('hide');
  });
  $('#DelDataModal').modal('show');
}
</script>
