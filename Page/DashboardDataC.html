<script>
const claerModalDataC = () => {
  $('#updatadataC1').hide();
  $('#updatadataC2').hide();
  $('#dataDataCInputKey').val("")
  $('#dataDataCInput1').val("")
  $('#dataDataCInput2').val("")
  $('#dataDataCInput3').val("")
  $('#dataDataCInput4').val("")
  $('#dataDataCInput5').val("")
  $("#fileDataB9").val("")
  $("#fileDataB10").val("")
  resetUploadSwitches();
  const inputdateC2 = document.getElementById('dataDataCInput2') 
  inputdateC2.type = "date";
}

const submitAddDataC = (obj) => {
  event.preventDefault();
  const dataDataCInputKey = $('#dataDataCInputKey').val();
  const dataDataCInput2 = $('#dataDataCInput2').val();
  const dataDataCInput3 = $('#dataDataCInput3').val();
  const dataDataCInput4 = $('#dataDataCInput4').val();
  const dataDataCInput5 = $('#dataDataCInput5').val();
  const dataDataCInput6 = $('#dataDataCInput6').val();
  const dataDataCInput7 = $('#dataDataCInput7').val();
  const fileDataC8 = $('#fileDataC8').val();

  if (dataDataCInputKey === "" && (!dataDataCInput3 || !dataDataCInput4 || !dataDataCInput5 || !dataDataCInput6 || !dataDataCInput7)) {
    createToast("⚠️ กรุณากรอกข้อมูลให้ครบถ้วน", 3);
    $.LoadingOverlay("hide");
    return;
  } else if (dataDataCInputKey !== "" && (!dataDataCInput3 || !dataDataCInput4 || !dataDataCInput5 || !dataDataCInput6 || !dataDataCInput7)) {
    createToast("⚠️ กรุณากรอกข้อมูลให้ครบถ้วน", 3);
    $.LoadingOverlay("hide");
    return;
  }

  $.LoadingOverlay("show", { image: "", fontawesome: "fa fa-spinner fa-spin" });

  if (dataDataCInputKey === "") {
    google.script.run.withSuccessHandler(function(res) {
      $('#DataCSetModal').modal('hide');
      $('#dataDataCInput1').val("")
      $('#dataDataCInput2').val("")
      $('#dataDataCInput3').val("")
      $('#dataDataCInput4').val("")
      $('#dataDataCInput5').val("")
      $("#fileDataC8").val("")
      $.LoadingOverlay("hide");
      createToast("✅ บันทึกข้อมูลสำเร็จ", 1);
      resetUploadSwitches();
      insertDataC();
    }).addDataC(obj);
  } else {
    google.script.run.withSuccessHandler(function(res) {
      $('#DataCSetModal').modal('hide');
      $('#dataDataCInput1').val("")
      $('#dataDataCInput2').val("")
      $('#dataDataCInput3').val("")
      $('#dataDataCInput4').val("")
      $('#dataDataCInput5').val("")
      $("#fileDataC8").val("")
      $.LoadingOverlay("hide");
      createToast("✅ แก้ไขข้อมูลสำเร็จ", 1);
      resetUploadSwitches();
      insertDataC();
    }).upDateDataC(obj);
  }
};

const editDataC = (el) => {
  const row = el.parentNode.parentNode.cells;
  const idDataC = row[0].textContent.trim();
  const dataDataCInput1 = row[1].textContent.trim();
  const dataDataCInput2 = row[2].textContent.trim();
  const dataDataCInput3 = row[3].textContent.trim();
  const dataDataCInput4 = row[4].textContent.trim();
  const dataDataCInput5 = row[5].textContent.trim();
  const dataDataCInput6 = row[6].textContent.trim();
  const dataDataCInput7 = row[7].textContent.trim();
  const inputdateC2 = document.getElementById('dataDataCInput2') 
  inputdateC2.type = "text";
  $('#DataCSetModal').modal('show');
  $('#updatadataC1').show();
  $('#updatadataC2').show();
  $('#dataDataCInputKey').val(idDataC);
  $('#dataDataCInput1').val(dataDataCInput1);
  $('#dataDataCInput2').val(dataDataCInput2);
  $('#dataDataCInput3').val(dataDataCInput3);
  $('#dataDataCInput4').val(dataDataCInput4);
  $('#dataDataCInput5').val(dataDataCInput5);
  $('#dataDataCInput6').val(dataDataCInput6);
  $('#dataDataCInput7').val(dataDataCInput7);
}

const delDataC = (el) => {
  const record = el.parentNode.parentNode.cells[0].innerText;
  $('#confirmBtnDel').off('click').on('click', function() {
    $.LoadingOverlay("show", { image: "", fontawesome: "fa fa-spinner fa-spin" });
    $('#DelDataModal').modal('hide');
    google.script.run.withSuccessHandler(function() {
      $.LoadingOverlay("hide");
      insertDataC();
      createToast("⛔ ลบข้อมูลสำเร็จ", 0);
    }).delRecDataC(record);
  });
  $('#xDelconfirmData').off('click').on('click', function() {
    $('#DelDataModal').modal('hide');
  });
  $('#DelDataModal').modal('show');
}

const sendAgency = (el) => {
  const row = el.parentNode.parentNode.cells;
  let idSendAgency, agencyDataInput1, agencyDataInput2, agencyDataInput3, agencyFile1;
  
  idSendAgency = row[0].textContent.trim();
  agencyDataInput1 = row[3].textContent.trim();
  agencyDataInput2 = row[4].textContent.trim();
  agencyDataInput3 = row[5].textContent.trim();
  agencyFile1 = row[8].getAttribute('data-file');

  $('#AgencySendModal').modal('show');
  $('#agencyDataInputKey').val(idSendAgency);
  $('#agencyDataInput1').val(agencyDataInput1);
  $('#agencyDataInput2').val(agencyDataInput2);
  $('#agencyDataInput3').val(agencyDataInput3);
  $('#agencyFileData1').val(agencyFile1 || '');
}
</script>
