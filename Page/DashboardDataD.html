<script>
const clearModalDataD = () => {
  $('#updatadataD1, #updatadataD2').hide();
  $('#dataDataDInputKey, #dataDataDInput1, #dataDataDInput2, #dataDataDInput3, #fileDataD6').val("");
  resetUploadSwitches();
  document.getElementById('dataDataDInput2').type = "date";
}

const submitAddDataD = (obj) => {
  event.preventDefault();
  const dataDataDInputKey = $('#dataDataDInputKey').val();
  const dataDataDInput3 = $('#dataDataDInput3').val();
  const dataDataDInput4 = $('#dataDataDInput4').val();
  const dataDataDInput5 = $('#dataDataDInput5').val();
  const fileDataD6 = $('#fileDataD6').val();
  if (!dataDataDInput3 || !dataDataDInput4 || !dataDataDInput5) {
    createToast("⚠️ กรุณากรอกข้อมูลให้ครบถ้วน", 3);
    $.LoadingOverlay("hide");
    return;
  }
  $.LoadingOverlay("show", { image: "", fontawesome: "fa fa-spinner fa-spin" });
  const successDataD = function(res) {
    $('#DataDSetModal').modal('hide');
    $('#dataDataDInput1, #dataDataDInput2, #dataDataDInput3, #fileDataD6').val("");
    $.LoadingOverlay("hide");
    createToast(dataDataDInputKey === "" ? "✅ บันทึกข้อมูลสำเร็จ" : "✅ แก้ไขข้อมูลสำเร็จ", 1);
    insertDataD();
    resetUploadSwitches();
  };
  if (dataDataDInputKey === "") {
    google.script.run.withSuccessHandler(successDataD).addDataD(obj);
  } else {
    google.script.run.withSuccessHandler(successDataD).upDateDataD(obj);
  }
}

const editDataD = (el) => {
  const row = el.parentNode.parentNode.cells;
  const idDataD = row[0].textContent.trim();
  const dataDataDInput1 = row[1].textContent.trim();
  const dataDataDInput2 = row[2].textContent.trim();
  const dataDataDInput3 = row[3].textContent.trim();
  const dataDataDInput4 = row[4].textContent.trim();
  const dataDataDInput5 = row[5].textContent.trim();
  document.getElementById('dataDataDInput2').type = "text";
  $('#DataDSetModal').modal('show');
  $('#updatadataD1').show();
  $('#updatadataD2').show();
  $('#dataDataDInputKey').val(idDataD);
  $('#dataDataDInput1').val(dataDataDInput1);
  $('#dataDataDInput2').val(dataDataDInput2);
  $('#dataDataDInput3').val(dataDataDInput3);
  $('#dataDataDInput4').val(dataDataDInput4);
  $('#dataDataDInput5').val(dataDataDInput5);
}

const delDataD = (el) => {
  const record = el.parentNode.parentNode.cells[0].innerText;
  $('#confirmBtnDel').off('click').on('click', function() {
    $.LoadingOverlay("show", { image: "", fontawesome: "fa fa-spinner fa-spin" });
    $('#DelDataModal').modal('hide');
    google.script.run.withSuccessHandler(function() {
      $.LoadingOverlay("hide");
      insertDataD();
      createToast("⛔ ลบข้อมูลสำเร็จ", 0);
    }).delRecDataD(record);
  });
  $('#xDelconfirmData').off('click').on('click', function() {
    $('#DelDataModal').modal('hide');
  });
  $('#DelDataModal').modal('show');
}
</script>
