<script>
const clearModalDataE = () => {
  $('#updatadataE1, #updatadataE2').hide();
  $('#dataDataEInputKey, #dataDataEInput1, #dataDataEInput2, #dataDataEInput3, #fileDataE6').val("");
  resetUploadSwitches();
  document.getElementById('dataDataEInput2').type = "date";
}

const submitAddDataE = async (obj, event) => {
  event.preventDefault();
  const dataDataEInputKey = $('#dataDataEInputKey').val();
  const dataDataEInput3 = $('#dataDataEInput3').val();
  const dataDataEInput4 = $('#dataDataEInput4').val();
  const dataDataEInput5 = $('#dataDataEInput5').val();
  const fileDataE6 = $('#fileDataE6').prop('files')[0];
  if (!dataDataEInput3 || !dataDataEInput4 || !dataDataEInput5) {
    createToast("⚠️ กรุณากรอกข้อมูลให้ครบถ้วน", 3);
    $.LoadingOverlay("hide");
    return;
  }
  $.LoadingOverlay("show", { image: "", fontawesome: "fa fa-spinner fa-spin" });
  obj.myfileDataE6 = fileDataE6 ? await getBase64(fileDataE6) : "";
  const successDataE = function(res) {
    $('#DataESetModal').modal('hide');
    $('#dataDataEInput1, #dataDataEInput2, #dataDataEInput3, #fileDataE6').val("");
    $.LoadingOverlay("hide");
    createToast(dataDataEInputKey === "" ? "✅ บันทึกข้อมูลสำเร็จ" : "✅ แก้ไขข้อมูลสำเร็จ", 1);
    insertDataE();
    resetUploadSwitches();
  };
  if (dataDataEInputKey === "") {
    google.script.run.withSuccessHandler(successDataE).addDataE(obj);
  } else {
    google.script.run.withSuccessHandler(successDataE).upDateDataE(obj);
  }
}

const editDataE = (el) => {
  const row = el.parentNode.parentNode.cells;
  const idDataE = row[0].textContent.trim();
  const dataDataEInput1 = row[1].textContent.trim();
  const dataDataEInput2 = row[2].textContent.trim();
  const dataDataEInput3 = row[3].textContent.trim();
  const dataDataEInput4 = row[4].textContent.trim();
  const dataDataEInput5 = row[5].textContent.trim();
  document.getElementById('dataDataEInput2').type = "text";
  $('#DataESetModal').modal('show');
  $('#updatadataE1').show();
  $('#updatadataE2').show();
  $('#dataDataEInputKey').val(idDataE);
  $('#dataDataEInput1').val(dataDataEInput1);
  $('#dataDataEInput2').val(dataDataEInput2);
  $('#dataDataEInput3').val(dataDataEInput3);
  $('#dataDataEInput4').val(dataDataEInput4);
  $('#dataDataEInput5').val(dataDataEInput5);
}

const delDataE = (el) => {
  const record = el.parentNode.parentNode.cells[0].innerText;
  $('#confirmBtnDel').off('click').on('click', function() {
    $.LoadingOverlay("show", { image: "", fontawesome: "fa fa-spinner fa-spin" });
    $('#DelDataModal').modal('hide');
    google.script.run.withSuccessHandler(function() {
      $.LoadingOverlay("hide");
      insertDataE();
      createToast("⛔ ลบข้อมูลสำเร็จ", 0);
    }).delRecDataE(record);
  });
  $('#xDelconfirmData').off('click').on('click', function() {
    $('#DelDataModal').modal('hide');
  });
  $('#DelDataModal').modal('show');
}
</script>
