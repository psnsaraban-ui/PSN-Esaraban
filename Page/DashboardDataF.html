<script>
const clearModalDataF = () => {
  $('#updatadataF1, #updatadataF2').hide();
  $('#dataDataFInputKey, #dataDataFInput1, #dataDataFInput2, #dataDataFInput3, #fileDataF6').val("");
  resetUploadSwitches();
  document.getElementById('dataDataFInput2').type = "date";
}

const submitAddDataF = (obj) => {
  event.preventDefault();
  const dataDataFInputKey = $('#dataDataFInputKey').val();
  const dataDataFInput3 = $('#dataDataFInput3').val();
  const dataDataFInput4 = $('#dataDataFInput4').val();
  const dataDataFInput5 = $('#dataDataFInput5').val();
  const fileDataF6 = $('#fileDataF6').val();
  if (!dataDataFInput3 || !dataDataFInput4 || !dataDataFInput5) {
    createToast("⚠️ กรุณากรอกข้อมูลให้ครบถ้วน", 3);
    $.LoadingOverlay("hide");
    return;
  }
  $.LoadingOverlay("show", { image: "", fontawesome: "fa fa-spinner fa-spin" });
  const successDataF = function(res) {
    $('#DataFSetModal').modal('hide');
    $('#dataDataFInput1, #dataDataFInput2, #dataDataFInput3, #fileDataF6').val("");
    $.LoadingOverlay("hide");
    createToast(dataDataFInputKey === "" ? "✅ บันทึกข้อมูลสำเร็จ" : "✅ แก้ไขข้อมูลสำเร็จ", 1);
    insertDataF();
    resetUploadSwitches();
  };
  if (dataDataFInputKey === "") {
    google.script.run.withSuccessHandler(successDataF).addDataF(obj);
  } else {
    google.script.run.withSuccessHandler(successDataF).upDateDataF(obj);
  }
}

const editDataF = (el) => {
  const row = el.parentNode.parentNode.cells;
  const idDataF = row[0].textContent.trim();
  const dataDataFInput1 = row[1].textContent.trim();
  const dataDataFInput2 = row[2].textContent.trim();
  const dataDataFInput3 = row[3].textContent.trim();
  const dataDataFInput4 = row[4].textContent.trim();
  const dataDataFInput5 = row[5].textContent.trim();
  document.getElementById('dataDataFInput2').type = "text";
  $('#DataFSetModal').modal('show');
  $('#updatadataF1').show();
  $('#updatadataF2').show();
  $('#dataDataFInputKey').val(idDataF);
  $('#dataDataFInput1').val(dataDataFInput1);
  $('#dataDataFInput2').val(dataDataFInput2);
  $('#dataDataFInput3').val(dataDataFInput3);
  $('#dataDataFInput4').val(dataDataFInput4);
  $('#dataDataFInput5').val(dataDataFInput5);
}

const delDataF = (el) => {
  const record = el.parentNode.parentNode.cells[0].innerText;
  $('#confirmBtnDel').off('click').on('click', function() {
    $.LoadingOverlay("show", { image: "", fontawesome: "fa fa-spinner fa-spin" });
    $('#DelDataModal').modal('hide');
    google.script.run.withSuccessHandler(function() {
      $.LoadingOverlay("hide");
      insertDataF();
      createToast("⛔ ลบข้อมูลสำเร็จ", 0);
    }).delRecDataF(record);
  });
  $('#xDelconfirmData').off('click').on('click', function() {
    $('#DelDataModal').modal('hide');
  });
  $('#DelDataModal').modal('show');
}
</script>
