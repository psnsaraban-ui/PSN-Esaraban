<script>
const clearModalDataG = () => {
  $('#updatadataG1, #updatadataG2').hide();
  $('#dataDataGInputKey, #dataDataGInput1, #dataDataGInput2, #dataDataGInput3, #fileDataG5').val("");
  resetUploadSwitches();
  document.getElementById('dataDataGInput3').type = "date";
}

const submitAddDataG = async (obj, event) => {
  event.preventDefault();
  const dataDataGInputKey = $('#dataDataGInputKey').val();
  const dataDataGInput1 = $('#dataDataGInput1').val();
  const dataDataGInput2 = $('#dataDataGInput2').val();
  const dataDataGInput3 = $('#dataDataGInput3').val();
  const dataDataGInput4 = $('#dataDataGInput4').val();
  const fileDataG5 = $('#fileDataG5').prop('files')[0];
  if (!dataDataGInput2 || !dataDataGInput4) {
    createToast("⚠️ กรุณากรอกข้อมูลให้ครบถ้วน", 3);
    $.LoadingOverlay("hide");
    return;
  }
  $.LoadingOverlay("show", { image: "", fontawesome: "fa fa-spinner fa-spin" });
  obj.myfileDataG5 = fileDataG5 ? await getBase64(fileDataG5) : "";
  const successDataG = function(res) {
    $('#DataGSetModal').modal('hide');
    $('#dataDataGInputKey, #dataDataGInput1, #dataDataGInput2, #dataDataGInput3, #fileDataG5').val("");
    $.LoadingOverlay("hide");
    createToast(dataDataGInputKey === "" ? "✅ บันทึกข้อมูลสำเร็จ" : "✅ แก้ไขข้อมูลสำเร็จ", 1);
    insertDataG();
    clearModalDataG();
  };
  if (dataDataGInputKey === "") {
    google.script.run.withSuccessHandler(successDataG).addDataG(obj);
  } else {
    google.script.run.withSuccessHandler(successDataG).upDateDataG(obj);
  }
}

const editDataG = (el) => {
  const row = el.parentNode.parentNode.cells;
  const idDataG = row[0].textContent.trim();
  const dataDataGInput1 = row[1].textContent.trim();
  const dataDataGInput2 = row[2].textContent.trim();
  const dataDataGInput3 = row[3].textContent.trim();
  const dataDataGInput4 = row[4].textContent.trim();
  document.getElementById('dataDataGInput3').type = "text";
  $('#DataGSetModal').modal('show');
  $('#updatadataG1').show();
  $('#updatadataG2').show();
  $('#dataDataGInputKey').val(idDataG);
  $('#dataDataGInput1').val(dataDataGInput1);
  $('#dataDataGInput2').val(dataDataGInput2);
  $('#dataDataGInput3').val(dataDataGInput3);
  $('#dataDataGInput4').val(dataDataGInput4);
}

const delDataG = (el) => {
  const record = el.parentNode.parentNode.cells[0].innerText;
  $('#confirmBtnDel').off('click').on('click', function() {
    $.LoadingOverlay("show", { image: "", fontawesome: "fa fa-spinner fa-spin" });
    $('#DelDataModal').modal('hide');
    google.script.run.withSuccessHandler(function() {
      $.LoadingOverlay("hide");
      insertDataG();
      createToast("⛔ ลบข้อมูลสำเร็จ", 0);
    }).delRecDataG(record);
  });
  $('#xDelconfirmData').off('click').on('click', function() {
    $('#DelDataModal').modal('hide');
  });
  $('#DelDataModal').modal('show');
}
</script>
