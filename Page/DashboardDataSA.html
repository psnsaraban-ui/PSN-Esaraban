<script>
const sendDataSA = (el) => {
  const row = el.parentNode.parentNode;
  const record = row.cells[0].innerText;
  const type = row.cells[1].innerText;
  const status = row.cells[2].innerText;
  const sendDate = row.cells[3].innerText;
  const number = row.cells[4].innerText;
  const subject = row.cells[5].innerText;
  const receiverName = row.cells[6].innerText;
  const department = row.cells[7].innerText;
  const details = row.cells[8].innerText;

  document.getElementById('dataDataSAInput1').value = '';
  $('#dataSAModal').modal('show');
  document.getElementById('confirmBtn').setAttribute('data-record', record);
  document.getElementById('confirmBtn').setAttribute('data-receiver', receiverName);
  document.getElementById('rejectBtn').setAttribute('data-record', record);
  document.getElementById('rejectBtn').setAttribute('data-receiver', receiverName);

  const recordDetails = `
    <p><strong>🆔 เลขที่เอกสาร : </strong> ${record} <strong>📋 ประเภท:</strong> ${type}</p>
    <p><strong>🔔 สถานะ:</strong> ${status} <strong>📅 วันที่ส่ง:</strong> ${sendDate}</p>
    <p><strong>🆔 เลขที่:</strong> ${number}</p>
    <p><strong>📝 เรื่อง:</strong> ${subject}</p>
    <p><strong>👦 ชื่อผู้รับ:</strong> ${receiverName} <strong>🏢 หน่วยงาน:</strong> ${department}</p>
    <p><strong>📝 รายละเอียด:</strong> ${details}</p>
  `;
  document.getElementById('recordDetails').innerHTML = recordDetails;
}

const saveData = (action) => {
  const record = document.getElementById(action + 'Btn').getAttribute('data-record');
  const receiverName = document.getElementById(action + 'Btn').getAttribute('data-receiver');
  const sigSA = document.getElementById('user-show4').innerHTML;
  const remark = document.getElementById('dataDataSAInput1').value;
  const saveData = { record, receiverName, sigSA, remark, action };

  $.LoadingOverlay("show", { image: "", fontawesome: "fa fa-spinner fa-spin" });

  google.script.run.withSuccessHandler(() => {
    $.LoadingOverlay("hide");
    $('#dataSAModal').modal('hide');
    createToast("✅ ยืนยันรายการสำเร็จ", 1);
    insertDataSA();
  }).sigSaveDataSA(saveData);
}

const followDataSA = (el) => {
  const row = el.parentNode.parentNode;
  const record = row.cells[0].innerText;
  const receiverName = row.cells[6].innerText;
  $('#confirmBtnfollow').off('click').on('click', function() {
    $.LoadingOverlay("show", { image: "", fontawesome: "fa fa-spinner fa-spin" });
    $('#followDataModal').modal('hide');
    google.script.run.withSuccessHandler(function() {
      $.LoadingOverlay("hide");
      insertDataSA();
      createToast("✅ ติดตามข้อมูลสำเร็จ", 0);
    }).followRecord(record, receiverName);
  });
  $('#xDelconfirmfollow').off('click').on('click', function() {
    $('#followDataModal').modal('hide');
  });
  $('#followDataModal').modal('show');
}
</script>
