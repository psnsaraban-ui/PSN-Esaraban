<script>

    "หน่วยงานD": "J7gcaeDxtzBUSKqFb5JWaKUiOdNFcYNCWUCq9I3IZgu",

let allsetDataMenu = [];

const insertsetMenu = () => {
  google.script.run.withSuccessHandler((data) => {
    allsetDataMenu = data;
    renderSetMenu(allsetDataMenu);
  }).getsetMenuItems();
}

const renderSetMenu = (res) => {
  const table = document.getElementById('tableSetMenu');
  table.innerHTML = '';

  if (res.length === 0) {
    const row = table.insertRow();
    row.innerHTML = `<td colspan='9' class='fw-bold text-danger text-center p-4'><i class='fa-solid fa-circle-info text-danger'></i> ไม่พบข้อมูล! 😓</td>`;
    return;
  }

  res.forEach((rowIndex, index) => {
    var row = table.insertRow();
    row.innerHTML = `
      <td class="text-center"><span style="font-size: 14px;">${index + 1}</span></td>
      <td><span style="font-size: 14px;">💻 ${rowIndex[0]}</span></td>
      <td class="text-center">
        <div class="custom-switch"> 
          <input type="checkbox" ${rowIndex[2].toUpperCase() === "TRUE" ? 'checked' : ''} id="switch-superadmin-${index}" class="custom-switch-input" onchange="updateMenu(${index}, 'SuperAdmin', this.checked)">
          <label for="switch-superadmin-${index}" class="custom-switch-label"></label>
        </div>
      </td>
      <td class="text-center">
        <div class="custom-switch"> 
          <input type="checkbox" ${rowIndex[3].toUpperCase() === "TRUE" ? 'checked' : ''} id="switch-admin-${index}" class="custom-switch-input" onchange="updateMenu(${index}, 'Admin', this.checked)">
          <label for="switch-admin-${index}" class="custom-switch-label"></label>
        </div>
      </td>
      <td class="text-center">
        <div class="custom-switch"> 
          <input type="checkbox" ${rowIndex[4].toUpperCase() === "TRUE" ? 'checked' : ''} id="switch-superuser-${index}" class="custom-switch-input" onchange="updateMenu(${index}, 'SuperUser', this.checked)">
          <label for="switch-superuser-${index}" class="custom-switch-label"></label>
        </div>
      </td>
      <td class="text-center">
        <div class="custom-switch"> 
          <input type="checkbox" ${rowIndex[5].toUpperCase() === "TRUE" ? 'checked' : ''} id="switch-user-${index}" class="custom-switch-input" onchange="updateMenu(${index}, 'User', this.checked)">
          <label for="switch-user-${index}" class="custom-switch-label"></label>
        </div>
      </td>
    `;
  });
}

const updateMenu = (index, role, isChecked) => {
  const menuItem = allsetDataMenu[index][1];
  const roleIndex = {
    'SuperAdmin': 2,
    'Admin': 3,  
    'SuperUser': 4,
    'User': 5
  }[role];
  allsetDataMenu[index][roleIndex] = isChecked ? "TRUE" : "FALSE";
  
  $.LoadingOverlay("show", { image: "", fontawesome: "fa fa-spinner fa-spin" });
  google.script.run.withSuccessHandler(() => {
    $.LoadingOverlay("hide");
    renderSetMenu(allsetDataMenu);
    createToast("✅ บันทึกข้อมูลสำเร็จ", 1);
  }).updateMenuStatus(menuItem, role, isChecked);
}

const createToast = (message, status, delay = 1000 * 5) => {
const toast = document.createElement('div');
    toast.className = 'border-0';
      toast.classList.add('toast', 'show');
      toast.setAttribute('role', 'alert');
      toast.setAttribute('aria-live', 'assertive');
      toast.setAttribute('aria-atomic', 'true');
  if (status == 1) {
    toast.style.backgroundColor = 'var(--bs-set)';
    toast.style.color = 'var(--bs-white)';
  } else if (status == 0) {
    toast.style.backgroundColor = 'var(--bs-del)';
    toast.style.color = 'var(--bs-white)';
  } else if (status == 2) {
    toast.style.backgroundColor = 'var(--bs-upload)';
    toast.style.color = 'var(--bs-white)';
  } else if (status == 3) {
    toast.style.backgroundColor = 'var(--bs-edit)';
    toast.style.color = 'var(--bs-white)';
  } else if (status == 4) {
    toast.style.backgroundColor = 'var(--bs-upload)';
    toast.style.color = '#000';
  }

const header = document.createElement('div');
      header.classList.add('toast-header', 'rounded-bottom-0');

const img = document.createElement('img');
      img.src = 'https://cdn.jsdelivr.net/gh/EPICCODING17/image/Logo-EicCoding.png'; 
      img.classList.add('rounded', 'me-2');
      img.style.width = '20px';
      img.alt = '...';

const strong = document.createElement('strong');
      strong.classList.add('me-auto');
      strong.innerText = 'แจ้งเตือนระบบ';

const small = document.createElement('small');
      small.classList.add('text-body-secondary');
let secondsElapsed = 0;
      small.innerText = `ตอนนี้`;

const interval = setInterval(() => {
      secondsElapsed += 1;
      small.innerText = `${secondsElapsed} วินาทีที่แล้ว`;
}, 1000);

const button = document.createElement('button');
      button.type = 'button';
      button.classList.add('btn-close');
      button.setAttribute('data-bs-dismiss', 'toast');
      button.setAttribute('aria-label', 'Close');
      button.onclick = () => {
      toast.remove();
      clearInterval(interval);
    };

      header.append(img, strong, small, button);

const body = document.createElement('div');
      body.classList.add('toast-body');
      body.style.fontSize = '14px';
      body.innerText = message;

      toast.append(header, body);

document.getElementById('toast-container').appendChild(toast);

setTimeout(() => {
  toast.classList.remove('show');
  toast.addEventListener('transitionend', () => {
  toast.remove();
  clearInterval(interval);
    });
  }, delay);
};
</script>
