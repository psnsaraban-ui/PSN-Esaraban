<script>
(() => {
  if (window.google && window.google.script && window.google.script.run) return;

  const apiUrl = 'https://script.google.com/macros/s/AKfycbwRY0K59FddGG8F_VdLgHoQZRZImkqyVHXNa9ASzPvoUGx8g1k8AJj-jdOdw48Z2eMQGg/exec';
  const createRunner = (successHandler = null, failureHandler = null, userObject = undefined) => new Proxy({}, {
    get(_target, property) {
      if (property === 'withSuccessHandler') {
        return callback => createRunner(callback, failureHandler, userObject);
      }
      if (property === 'withFailureHandler') {
        return callback => createRunner(successHandler, callback, userObject);
      }
      if (property === 'withUserObject') {
        return object => createRunner(successHandler, failureHandler, object);
      }
      return (...args) => {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 30000);
        fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ functionName: property, args }),
          signal: controller.signal
        })
          .then(response => {
            if (!response.ok) throw new Error(`Apps Script HTTP ${response.status}`);
            return response.json();
          })
          .then(payload => {
            if (!payload.ok) throw new Error(payload.error || 'Apps Script request failed');
            if (successHandler) successHandler(payload.result, userObject);
          })
          .catch(error => {
            if (failureHandler) {
              failureHandler(error, userObject);
            } else {
              console.error(error);
              if (window.jQuery && $.LoadingOverlay) $.LoadingOverlay('hide');
              if (typeof window.createToast === 'function') {
                window.createToast(`ไม่สามารถเชื่อมต่อระบบได้: ${error.message}`, 3);
              }
            }
          })
          .finally(() => clearTimeout(timeout));
      };
    }
  });

  window.google = window.google || {};
  window.google.script = { run: createRunner() };
})();
</script>
