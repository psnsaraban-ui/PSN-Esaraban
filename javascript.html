$(document).ready(function() {
  $('.sidebar-dropdown-menu').slideUp('fast');

  $('.sidebar-menu-item.has-dropdown > a, .sidebar-dropdown-menu-item.has-dropdown > a').click(function(e) {
    e.preventDefault();
    $('.sidebar-dropdown-menu').css('overflow-y', 'hidden');
    if(!($(this).parent().hasClass('focused'))) {
      $(this).parent().parent().find('.sidebar-dropdown-menu').slideUp('fast');
      $(this).parent().parent().find('.has-dropdown').removeClass('focused');
    }
    $(this).next().slideToggle('fast');
    $(this).parent().toggleClass('focused');
  });

  $('.sidebar-toggle').click(function() {
    $('.sidebar').toggleClass('collapsed');

    $('.sidebar.collapsed').mouseleave(function() {
      $('.sidebar-dropdown-menu').slideUp('fast');
      $('.sidebar-menu-item.has-dropdown, .sidebar-dropdown-menu-item.has-dropdown').removeClass('focused');
    });
  });

  $('.sidebar-overlay').click(function() {
    $('.sidebar').addClass('collapsed');
    $('.sidebar-dropdown-menu').slideUp('fast');
    $('.sidebar-menu-item.has-dropdown, .sidebar-dropdown-menu-item.has-dropdown').removeClass('focused');
  });

  if(window.innerWidth < 768) {
    $('.sidebar').addClass('collapsed');
  }
});

const setDisPlayMenu = (status, menuItems) => {
  const allMenuItems = Object.keys(menuItems);
  allMenuItems.forEach(id => {
    const element = document.getElementById(id);
    if (element) {
      element.style.display = "none";
    }
  });
  for (const item in menuItems) {
    if (menuItems[item][status]) {
      const element = document.getElementById(item);
      if (element) {
        element.style.display = "block";
      }
    }
  }
}

async function getIPAddress() {
  const ipAPI = "//api.ipify.org?format=json";
  const response = await fetch(ipAPI); 
  const data = await response.json(); 
  const inputValue = data.ip;
  return inputValue;
}

async function Logout() {

      $('#picadmin1').attr('src', "");

      $("#dashboardPage").hide();
      $('#pageformLogin').show();
    clearTimeout(logoutTimer);
    ['mousemove', 'keydown', 'scroll', 'click'].forEach(event => {
        window.removeEventListener(event, resetTimer);
    });

  } else {
    $.LoadingOverlay("hide");

const toggleUploadFile = (uploadSwitchId, uploadFileSectionId, fileInputId) => {
  const uploadSwitch = document.getElementById(uploadSwitchId);
  const uploadFileSection = document.getElementById(uploadFileSectionId);
  const fileInput = document.getElementById(fileInputId);
  
  if (uploadSwitch.checked) {
    uploadFileSection.style.display = 'block';
  } else {
    uploadFileSection.style.display = 'none';
    fileInput.value = "";
  }
}

function populateDropdown(data, elementId) {
  var selectElement = document.getElementById(elementId);
  selectElement.innerHTML = "";
  data.forEach(item => {
    let option = document.createElement("option");
    option.value = item;
    option.text = item;
    selectElement.appendChild(option);
  });
  let otherOption = document.createElement("option");
  otherOption.value = "อื่น ๆ";
  otherOption.text = "อื่น ๆ";
  selectElement.appendChild(otherOption);
}

const sendData = (el, dataType) => {
  const row = el.parentNode.parentNode.cells;
  let idSend, sendDataInput1, sendFile1, sendFile2, sendFile3;

  switch (dataType) {
    case 'DataA':
      dataTypeSend = 'ภายนอก';
      idSend = row[0].textContent.trim();
      sendDataInput1 = row[9].textContent.trim();
      sendFile1 = row[11].getAttribute('data-file');
      sendFile2 = row[12].getAttribute('data-file');
      sendFile3 = row[13].getAttribute('data-file');
      break;
    case 'DataB':
      dataTypeSend = 'ภายใน';
      idSend = row[0].textContent.trim();
      sendDataInput1 = row[7].textContent.trim();
      sendFile1 = row[9].getAttribute('data-file');
      sendFile2 = row[10].getAttribute('data-file');
      break;
    case 'DataD':
      dataTypeSend = 'บันทึก';
      idSend = row[0].textContent.trim();
      sendDataInput1 = row[3].textContent.trim();
      sendFile1 = row[6].getAttribute('data-file');
      break;
    case 'DataE':
      dataTypeSend = 'คำสั่ง';
      idSend = row[0].textContent.trim();
      sendDataInput1 = row[3].textContent.trim();
      sendFile1 = row[6].getAttribute('data-file');
      break;
    default:
      console.error("Unknown data type");
      return;
  }
  document.getElementById('dataSendTitle').innerText = `(${dataTypeSend})`;
  $('#dataSendModal').modal('show');
  $('#sendDataInputKey').val(idSend);
  $('#sendDataInput1').val(sendDataInput1);
  $('#sendFileData1').val(sendFile1 || '');
  $('#sendFileData2').val(sendFile2 || '');
  $('#sendFileData3').val(sendFile3 || '');
  $('#sendDataType').val(dataType);
}

const populateSelectElements = (selectIds, options) => {
  selectIds.forEach(selectId => {
    let selectElement = document.getElementById(selectId);
    if (selectElement) {
      selectElement.innerHTML = '';

      let defaultOption = document.createElement("option");
      defaultOption.value = "";
      defaultOption.text = "กรุณาเลือกรายการ";
      defaultOption.selected = true;
      selectElement.appendChild(defaultOption);

      options.forEach(optionText => {
        let option = document.createElement("option");
        option.value = optionText;
        option.text = optionText;
        selectElement.appendChild(option);
      });
    }
  });
}

const resetSelectElements = (selectIds) => {
  selectIds.forEach(selectId => {

  });
}

const renderAlertData = (data) => {
  const container = document.getElementById('sendes-log');
  const bellIcon = document.querySelector('.set-icons');
  container.innerHTML = '';

  if (data.length === 0) {
    container.innerHTML = '<p class="fw-bold text-danger text-center p-4"><i class="fa-solid fa-circle-info text-danger"></i> ไม่มีแจ้งเตือน!</p>';
    bellIcon.classList.remove('bx-tada');
  } else {
    data.sort((a, b) => {
      const idA = parseInt(a.idstatus.split('/')[0].replace('SA-', ''));
      const idB = parseInt(b.idstatus.split('/')[0].replace('SA-', ''));
      return idB - idA;
    });

    data.forEach(item => {
      const element = `
        <a href="javascript:void(0)" class="py-2 px-3 d-flex align-items-center dropdown-item">
          <span class="me-3">
            <img src="${item.img}" alt="user" class="rounded-circle" width="48" height="48">
          </span>
          <div class="w-75 d-inline-block v-middle">
            <div class="d-flex align-items-center justify-content-between">
              <h6 class="mb-0 fw-semibold lh-base limited-text">🔔 ${item.status}</h6>
              <span class="text-body-secondary">📍 ${item.idstatus} (${item.type})</span>  
            </div>
            <span class="d-block fw-bold text-body-dark limited-text">🙋‍♂️ ${item.name}</span>
          </div>
        </a>`;
      container.innerHTML += element;
    });
    bellIcon.classList.add('bx-tada');
  }
}

function exportExcel(tableIndex) {
  let tableId;
  let tableName;
  
  switch (tableIndex) {
    case 1:
      tableId = "#showDataA";
      tableName = "ทะเบียนหนังสือรับ";
      break;
    case 2:
      tableId = "#showDataB";
      tableName = "ทะเบียนหนังสือรับภายใน";
      break;
    case 3:
      tableId = "#showDataC";
      tableName = "ทะเบียนส่งออก";
      break;
    case 4:
      tableId = "#showDataD";
      tableName = "ทะเบียนบันทึกข้อความ";
      break;
    case 5:
      tableId = "#showDataE";
      tableName = "ทะเบียนคำสั่ง";
      break;
    case 6:
      tableId = "#showDataF";
      tableName = "ทะเบียนสัญญา";
      break;
    case 7:
      tableId = "#showDataG";
      tableName = "ประกาศ";
      break;
    case 8:
      tableId = "#showDataH";
      tableName = "ประชาสัมพันธ์";
      break;
    default:
      createToast("⚠️ ไม่พบตารางที่ต้องการส่งออก!", 3);
      return;
  }

  if (!$.fn.DataTable.isDataTable(tableId)) {
    createToast("⚠️ ตารางยังไม่ถูกโหลด!", 3);
    return;
  }

  const table = $(tableId).DataTable();
  const tableData = table.rows({ search: "applied" }).data().toArray();

  if (tableData.length === 0) {
    createToast("⚠️ ไม่มีข้อมูลให้ส่งออก!", 3);
    return;
  }

  const headers = $(tableId).find("thead th").map(function () {
    return $(this).text();
  }).get();

  const data = tableData.map(row => {
    return row.map(cell => {
      if (typeof cell === "string") {
        const parsed = $.parseHTML(cell);
        const link = $(parsed).find("a").attr("href");
        return link ? link : $(parsed).text();
      }
      return cell;
    });
  });

  const worksheet = XLSX.utils.aoa_to_sheet([headers, ...data]);

  const wscols = headers.map(() => ({ width: 20 }));
  worksheet["!cols"] = wscols;

  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, tableName);

  const fileName = `${tableName}.xlsx`;
  XLSX.writeFile(workbook, fileName);
}
